<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin — King Surya Files</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="brand-icon">👑</span>
      <span class="brand-name">King Surya Files — Admin</span>
    </div>
    <div class="topbar-actions">
      <a href="index.html" class="admin-link">← Back to site</a>
      <button id="themeToggle" class="icon-btn" title="Toggle dark mode">🌙</button>
    </div>
  </header>

  <main class="container">
    <section class="panel">
      <h2>Upload a file</h2>
      <p class="hint">Uploading requires the admin password.</p>
      <form id="uploadForm" class="upload-form">
        <input type="text" id="titleInput" placeholder="Title" required>
        <textarea id="descInput" placeholder="Description (optional)"></textarea>
        <select id="catInput">
          <option value="documents">Documents</option>
          <option value="images">Images</option>
          <option value="archives">Archives</option>
          <option value="media">Media</option>
          <option value="data">Data</option>
          <option value="other" selected>Other</option>
        </select>
        <input type="file" id="fileInput" required>
        <input type="password" id="uploadPassword" placeholder="Admin password" required>
        <button type="submit" class="btn btn-primary">Upload</button>
      </form>
      <div id="uploadStatus" class="status"></div>
    </section>

    <section class="panel">
      <h2>Manage files</h2>
      <div id="adminStatus" class="status"></div>
      <div id="adminFileList" class="admin-file-list"></div>
    </section>
  </main>

  <script src="admin.js"></script>
</body>
</html>
